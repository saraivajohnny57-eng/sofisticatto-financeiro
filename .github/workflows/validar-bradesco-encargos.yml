name: Validacao Bradesco Encargos
on:
  push:
    branches:
      - fix-bradesco-encargos-escala-20261106
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Testar contrato de encargos (sem credenciais nem rede bancária)
        run: npm run test:bradesco-encargos
