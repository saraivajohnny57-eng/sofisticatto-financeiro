name: Security regression (offline)
on:
  push:
    branches: [cline-testes-integracoes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline security checks
        run: node --test tests/security-regression.test.js
