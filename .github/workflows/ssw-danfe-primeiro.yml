name: Validar SSW DANFE
on:
  push:
    branches: [fix-ssw-danfe-primeiro-20261029]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check lib/integracoes/consultar-rastreio-ssw.js
      - run: node --test tests/ssw-danfe-primeiro.test.js
