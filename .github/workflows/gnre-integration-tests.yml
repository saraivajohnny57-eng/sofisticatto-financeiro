name: GNRE and integration regression tests
on:
  push:
    branches: [cline-testes-integracoes]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate GNRE fixture against official XSD
        run: |
          python3 -m pip install --user lxml
          node tests/gnre-gerar-fixture-xsd.cjs /tmp/gnre-lote-fixture.xml
          python3 - <<'PY'
          from lxml import etree
          schema = etree.XMLSchema(etree.parse('docs/gnre-xsd/lote_gnre_v2.00.xsd'))
          doc = etree.parse('/tmp/gnre-lote-fixture.xml')
          if not schema.validate(doc):
              raise SystemExit(str(schema.error_log))
          print('GNRE XML validated against official XSD')
          PY
