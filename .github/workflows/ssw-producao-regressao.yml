name: Validar correção isolada SSW
on:
  push:
    branches: [fix-ssw-producao-20261029]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript
        run: node --check coletas.js
      - name: Regressões SSW
        run: node --test tests/ssw-producao-regressao.test.js
