name: Bradesco auth regression
on:
  push:
    branches:
      - fix/bradesco-auth-failure-classification-20261103
  pull_request:
    paths:
      - api/banco-bradesco.js
      - tests/bradesco-auth-failure.test.cjs
      - .github/workflows/bradesco-auth-regression.yml
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/banco-bradesco.js
      - run: node --test tests/bradesco-auth-failure.test.cjs
