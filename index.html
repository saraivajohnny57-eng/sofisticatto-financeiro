<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sofisticatto Financeiro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f5f2fb;
display:flex;
min-height:100vh;
color:#4d4694;
}

.sidebar{
width:250px;
background:white;
padding:25px;
box-shadow:0 0 15px rgba(0,0,0,0.08);
display:flex;
flex-direction:column;
justify-content:space-between;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo h1{
font-size:38px;
font-style:italic;
font-weight:300;
color:#5a4fa3;
}

.logo p{
font-size:12px;
letter-spacing:6px;
margin-top:5px;
color:#9c92d9;
}

.menu button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#ede9fb;
margin-bottom:10px;
cursor:pointer;
font-size:16px;
color:#4d4694;
transition:0.3s;
}

.menu button:hover{
background:#dcd4ff;
}

.logout{
background:#5a4fa3 !important;
color:white !important;
}

.main{
flex:1;
padding:30px;
overflow:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.card{
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 0 15px rgba(0,0,0,0.05);
margin-bottom:25px;
}

.total{
min-width:250px;
}

.total h2{
font-size:35px;
margin-top:10px;
}

.inputs{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;
}

input{
padding:15px;
border:none;
border-radius:15px;
background:#f5f2fb;
outline:none;
}

.salvar{
margin-top:20px;
background:#5a4fa3;
color:white;
border:none;
padding:15px 25px;
border-radius:15px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:15px;
border-bottom:1px solid #eee;
text-align:left;
}

.status{
padding:8px 15px;
border-radius:20px;
font-size:12px;
color:white;
}

.andamento{
background:#f0ad4e;
}

.finalizado{
background:#5cb85c;
}

.finalizar{
background:#5a4fa3;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

.login{
position:fixed;
inset:0;
background:#f5f2fb;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.login-box{
background:white;
padding:40px;
border-radius:30px;
width:350px;
box-shadow:0 0 20px rgba(0,0,0,0.08);
}

.login-box h1{
text-align:center;
font-size:40px;
font-style:italic;
font-weight:300;
color:#5a4fa3;
}

.login-box p{
text-align:center;
letter-spacing:5px;
font-size:12px;
margin-bottom:30px;
color:#9c92d9;
}

.login-box input{
width:100%;
margin-bottom:15px;
}

.login-box button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
cursor:pointer;
margin-top:10px;
}

.entrar{
background:#5a4fa3;
color:white;
}

.criar{
background:#ede9fb;
color:#4d4694;
}

</style>

</head>

<body>

<div id="login" class="login">

<div class="login-box">

<h1>Sofisticatto</h1>
<p>COSMÉTICOS</p>

<input type="email" id="email" placeholder="Email">
<input type="password" id="senha" placeholder="Senha">

<button class="entrar" onclick="login()">
Entrar
</button>

<button class="criar" onclick="cadastrar()">
Criar Conta
</button>

</div>

</div>

<div class="sidebar">

<div>

<div class="logo">
<h1>Sofisticatto</h1>
<p>COSMÉTICOS</p>
</div>

<div class="menu">
<button>Dashboard</button>
<button>Relatórios</button>
<button>Histórico</button>
</div>

</div>

<button class="logout" onclick="logout()">
Sair
</button>

</div>

<div class="main">

<div class="top">

<div>
<h1>Painel Financeiro</h1>
<p>Sistema online integrado com Supabase</p>
</div>

<div class="card total">
<p>Total Geral</p>
<h2 id="total">R$ 0,00</h2>
</div>

</div>

<div class="card">

<h2>Novo Relatório</h2>

<div class="inputs">

<input type="text" id="nome" placeholder="Nome do cliente">

<input type="number" id="valor" placeholder="Valor do boleto">

<input type="text" id="banco" placeholder="Banco">

<input type="text" id="observacao" placeholder="Observação">

</div>

<button class="salvar" onclick="salvarRelatorio()">
Salvar Relatório
</button>

</div>

<div class="card">

<h2>Relatórios</h2>

<table>

<thead>

<tr>
<th>Cliente</th>
<th>Valor</th>
<th>Banco</th>
<th>Observação</th>
<th>Status</th>
<th>Data</th>
<th>Ação</th>
</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

</div>

<div class="card">

<h2>Total por Banco</h2>

<canvas id="grafico"></canvas>

</div>

</div>

<script>

const SUPABASE_URL =
"https://drtgtwwsbxrmqcaabzcs.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydGd0d3dzYnhybXFjYWFiemNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODYyMDQsImV4cCI6MjA5MzY2MjIwNH0.7TIaXvrFPaCNLlTrFmsaVbTnbvxL2uVckdPN3L9tBbY";

const banco =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let grafico = null;

async function cadastrar(){

const email =
document.getElementById("email").value;

const senha =
document.getElementById("senha").value;

const { error } =
await banco.auth.signUp({
email:email,
password:senha
});

if(error){

alert(error.message);

}else{

alert("Conta criada com sucesso!");

}

}

async function login(){

const email =
document.getElementById("email").value;

const senha =
document.getElementById("senha").value;

const { error } =
await banco.auth.signInWithPassword({
email:email,
password:senha
});

if(error){

alert(error.message);

}else{

document.getElementById("login").style.display =
"none";

carregarRelatorios();

}

}

async function logout(){

await banco.auth.signOut();

location.reload();

}

async function salvarRelatorio(){

const nome =
document.getElementById("nome").value;

const valor =
document.getElementById("valor").value;

const bancoNome =
document.getElementById("banco").value;

const observacao =
document.getElementById("observacao").value;

const { error } =
await banco
.from("boletos")
.insert([{

nome:nome,
valor:valor,
banco:bancoNome,
observacao:observacao,
status:"Em andamento",
data_finalizacao:new Date()

}]);

if(error){

alert(error.message);

}else{

alert("Relatório salvo!");

limpar();

carregarRelatorios();

}

}

async function finalizar(id){

await banco
.from("boletos")
.update({
status:"Finalizado"
})
.eq("id",id);

carregarRelatorios();

}

async function carregarRelatorios(){

const { data, error } =
await banco
.from("boletos")
.select("*")
.order("id",{ascending:false});

if(error){

console.log(error);

return;

}

const tabela =
document.getElementById("tabela");

tabela.innerHTML = "";

let total = 0;

let bancos = {};

data.forEach(item=>{

total += Number(item.valor);

if(!bancos[item.banco]){
bancos[item.banco] = 0;
}

bancos[item.banco] +=
Number(item.valor);

tabela.innerHTML += `

<tr>

<td>${item.nome}</td>

<td>
R$ ${Number(item.valor)
.toLocaleString("pt-BR")}
</td>

<td>${item.banco}</td>

<td>${item.observacao}</td>

<td>

<span class="status ${
item.status == "Finalizado"
?
"finalizado"
:
"andamento"
}">

${item.status}

</span>

</td>

<td>

${new Date(item.data_finalizacao)
.toLocaleDateString("pt-BR")}

</td>

<td>

${
item.status != "Finalizado"
?
`
<button
class="finalizar"
onclick="finalizar('${item.id}')">

Finalizar

</button>
`
:
""
}

</td>

</tr>

`;

});

document.getElementById("total")
.innerHTML =
"R$ " +
total.toLocaleString("pt-BR");

atualizarGrafico(bancos);

}

function atualizarGrafico(bancos){

const labels =
Object.keys(bancos);

const valores =
Object.values(bancos);

if(grafico){
grafico.destroy();
}

grafico = new Chart(
document.getElementById("grafico"),
{

type:"bar",

data:{

labels:labels,

datasets:[{

label:"Total por banco",

data:valores

}]

}

});

}

function limpar(){

document.getElementById("nome").value = "";
document.getElementById("valor").value = "";
document.getElementById("banco").value = "";
document.getElementById("observacao").value = "";

}

banco
.channel("tempo-real")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"boletos"
},
payload=>{
carregarRelatorios();
}
)
.subscribe();

</script>

</body>
</html>
