<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofisticatto Financeiro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f2fb;display:flex;min-height:100vh;color:#4d4694}
.sidebar{width:250px;background:white;padding:25px;box-shadow:0 0 15px rgba(0,0,0,.08);display:flex;flex-direction:column;justify-content:space-between}
.logo{text-align:center;margin-bottom:30px}
.logo h1{font-size:38px;font-style:italic;font-weight:300;color:#5a4fa3}
.logo p{font-size:12px;letter-spacing:6px;color:#9c92d9}
.menu button{width:100%;padding:15px;border:none;border-radius:15px;background:#ede9fb;margin-bottom:10px;cursor:pointer;color:#4d4694}
.logout{background:#5a4fa3!important;color:white!important}
.main{flex:1;padding:30px;overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.card{background:white;padding:25px;border-radius:25px;box-shadow:0 0 15px rgba(0,0,0,.05);margin-bottom:25px}
.total{min-width:250px}
.total h2{font-size:35px;margin-top:10px}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px}
input,select{padding:15px;border:none;border-radius:15px;background:#f5f2fb;outline:none;width:100%}
button{cursor:pointer}
.salvar{margin-top:20px;background:#5a4fa3;color:white;border:none;padding:15px 25px;border-radius:15px}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:15px;border-bottom:1px solid #eee;text-align:left}
.status{padding:8px 15px;border-radius:20px;font-size:12px;color:white}
.andamento{background:#f0ad4e}
.finalizado{background:#5cb85c}
.finalizar,.editar,.excluir{border:none;padding:10px 15px;border-radius:10px;color:white;margin:3px}
.finalizar{background:#5a4fa3}
.editar{background:#2980b9}
.excluir{background:#c0392b}
.login{position:fixed;inset:0;background:#f5f2fb;display:flex;justify-content:center;align-items:center;z-index:999}
.login-box{background:white;padding:40px;border-radius:30px;width:350px;box-shadow:0 0 20px rgba(0,0,0,.08)}
.login-box h1{text-align:center;font-size:40px;font-style:italic;font-weight:300;color:#5a4fa3}
.login-box p{text-align:center;letter-spacing:5px;font-size:12px;margin-bottom:30px;color:#9c92d9}
.login-box input{margin-bottom:15px}
.login-box button{width:100%;padding:15px;border:none;border-radius:15px;margin-top:10px}
.entrar{background:#5a4fa3;color:white}
.usuario-logado{font-size:14px;background:#ede9fb;padding:12px;border-radius:15px;margin-bottom:20px}
</style>
</head>

<body>

<div id="loginTela" class="login">
  <div class="login-box">
    <h1>Sofisticatto</h1>
    <p>COSMÉTICOS</p>

    <input type="text" id="login" placeholder="Login">
    <input type="password" id="senha" placeholder="Senha">

    <button class="entrar" onclick="entrar()">Entrar</button>
  </div>
</div>

<div class="sidebar">
  <div>
    <div class="logo">
      <h1>Sofisticatto</h1>
      <p>COSMÉTICOS</p>
    </div>

    <div id="usuarioInfo" class="usuario-logado"></div>

    <div class="menu">
      <button onclick="mostrarSecao('dashboard')">Dashboard</button>
      <button onclick="mostrarSecao('relatorios')">Relatórios</button>
      <button onclick="mostrarSecao('historico')">Histórico</button>
      <button id="btnAdmin" onclick="mostrarSecao('admin')" style="display:none;">Admin</button>
    </div>
  </div>

  <button class="logout" onclick="sair()">Sair</button>
</div>

<div class="main">

  <div id="dashboard">
    <div class="top">
      <div>
        <h1>Painel Financeiro</h1>
        <p>Sistema online integrado com Supabase</p>
      </div>

      <div class="card total">
        <p>Total Geral</p>
        <h2 id="total">R$ 0,00</h2>
      </div>
    </div>

    <div class="card">
      <h2>Total por Banco</h2>
      <canvas id="grafico"></canvas>
    </div>
  </div>

  <div id="relatorios" style="display:none;">
    <div class="card">
      <h2>Novo Relatório</h2>

      <div class="inputs">
        <input type="text" id="nome" placeholder="Nome do cliente">
        <input type="number" id="valor" placeholder="Valor do boleto">
        <input type="text" id="bancoCampo" placeholder="Banco">
        <input type="text" id="observacao" placeholder="Observação">
      </div>

      <button class="salvar" onclick="salvarRelatorio()">Salvar Relatório</button>
    </div>

    <div class="card">
      <h2>Relatórios</h2>

      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Valor</th>
            <th>Banco</th>
            <th>Observação</th>
            <th>Status</th>
            <th>Data</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
  </div>
